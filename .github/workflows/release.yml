# Tagged releases. Push v1.0.0 and all four installers are built, signed and
# published to GitHub Releases.
#
# Mac builds must run on macOS and Windows signing must run on Windows, hence
# the matrix. Credentials come from repository secrets only — this repo is
# public, so a committed certificate would leak the company signing identity.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        target: [suite, teams]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # electron-builder only packages out/, it never produces it, so the bundle
      # has to be built first. This does not use npm run build:${{ matrix.target }}
      # because that also runs npm run assets, which shells out to sips and so
      # only works on macOS; the assets it generates are committed already.
      - name: Bundle ${{ matrix.target }}
        run: npx electron-vite build
        env:
          BSP_TARGET: ${{ matrix.target }}

      # The macOS DMG step intermittently fails inside dmgbuild with a plistlib
      # error from hdiutil. It succeeds on a retry.
      - name: Build and publish ${{ matrix.target }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder -c electron-builder.${{ matrix.target }}.yml --publish always; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Windows — Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          # Mac — Developer ID plus notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
