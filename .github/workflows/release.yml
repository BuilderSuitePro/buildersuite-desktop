# Tagged releases. Push v1.0.0 and all four installers are built, signed and
# published to GitHub Releases.
#
# Mac builds must run on macOS and Windows signing must run on Windows, hence
# the matrix. Credentials come from repository secrets only — this repo is
# public, so a committed certificate would leak the company signing identity.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        target: [suite, teams]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and publish ${{ matrix.target }}
        run: npx electron-builder -c electron-builder.${{ matrix.target }}.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Windows — Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

          # Mac — Developer ID plus notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
