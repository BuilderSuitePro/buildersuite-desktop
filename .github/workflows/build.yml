# Unsigned builds on every push.
#
# This is the only way to get a Windows .exe for testing: NSIS cannot be
# cross-built from Apple Silicon macOS, so a Windows runner is required even
# before any certificates are bought.
#
# Artifacts land under the workflow run, not on a release.

name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        target: [suite, teams]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The macOS DMG step intermittently fails inside dmgbuild with a plistlib
      # error from hdiutil. It succeeds on a retry.
      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder -c electron-builder.${{ matrix.target }}.yml --publish never; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
        env:
          # Unsigned on purpose at this stage.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/*.exe
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.zip
