extends: electron-builder.base.yml

productName: BuilderTeams
appId: com.kingdomtexas.builderteams

directories:
  output: dist/teams
  buildResources: build/teams

extraResources:
  - from: build/teams/tray
    to: tray
  - from: build/overlays
    to: overlays

publish:
  - provider: github
    owner: buildersuitepro
    repo: buildersuite-desktop
    # Distinct channel so this app can never install BuilderSuite Pro's build.
    # Both apps publish into one repo; without this they would both write
    # latest.yml and overwrite each other.
    channel: teams
    updaterCacheDirName: builderteams-updater

mac:
  # A prebuilt .icns, not a PNG. electron-builder can convert a single 1024px
  # PNG itself, but then every size in the set carries the same artwork and the
  # blueprint hairlines turn to mush below 32px. scripts/prepare-assets.mjs
  # builds the set with simplified art in the small slots.
  icon: build/teams/icon.icns
  # No version number: the download link must stay valid across releases.
  artifactName: BuilderTeams.${ext}

win:
  # Deliberately not the mac icon. Windows draws the icon as-is rather than
  # masking it to a rounded shape, so the mac tile's transparent padding would
  # render small and floaty in the taskbar; icon-win.png is full-bleed.
  icon: build/teams/icon-win.png
  artifactName: BuilderTeams-Setup.${ext}

nsis:
  shortcutName: BuilderTeams
